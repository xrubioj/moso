name: Auto-approve own PRs

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual runs
    inputs:
      pr_number:
        description: PR number to approve
        required: true

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner)
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify PR author is repository owner
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          AUTHOR="$(gh pr view "$PR_NUMBER" --json author --jq .author.login)"
          if [ "$AUTHOR" != "$REPO_OWNER" ]; then
            echo "ERROR: PR #$PR_NUMBER was opened by '$AUTHOR', not '$REPO_OWNER'" >&2
            exit 1
          fi
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Auto-approve PR
        run: gh pr review "$PR_NUMBER" --approve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
