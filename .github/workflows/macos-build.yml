name: macOS Universal Build + DMG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    env:
      APP_NAME: Moso

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Determine Version
        run: |
          # TODO: Improve versioning for non-tag builds
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="0.0.0"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building version $APP_VERSION"

      - name: Build Universal App
        run: |
          set -e
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            ARCHS="arm64 x86_64" \
            MARKETING_VERSION="${{ env.APP_VERSION }}" \
            clean build

      - name: Prepare App Bundle
        run: |
          set -e
          APP_NAME="${{ env.APP_NAME }}"
          echo "Expecting ${APP_NAME}.app in ./DerivedData/Build/Products/Release..."
          APP_PATH="$(pwd)/DerivedData/Build/Products/Release/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: ${APP_NAME}.app not found at expected path: $APP_PATH" >&2
            echo "Listing DerivedData Build/Products for debugging:"
            ls -la ./DerivedData/Build/Products || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          mkdir -p dist
          /usr/bin/ditto "$APP_PATH" "dist/${APP_NAME}.app"
          echo "Copied to dist/${APP_NAME}.app"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.APP_NAME }}-macOS-Universal-app"
          path: dist/

      - name: Zip App
        run: |
          set -e
          ditto -c -k --keepParent "dist/${{ env.APP_NAME }}.app" "dist/${{ env.APP_NAME }}.zip"

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.APP_NAME }}-macOS-Universal-zip"
          path: dist/${{ env.APP_NAME }}.zip

      - name: Create DMG
        run: |
          set -e
          APP_NAME="${{ env.APP_NAME }}"
          mkdir dmg_src
          cp -R "dist/${APP_NAME}.app" dmg_src/

          ln -s /Applications dmg_src/Applications || true

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dmg_src \
            -format UDZO \
            -ov \
            "dist/${APP_NAME}.dmg"

          echo "DMG created at dist/${APP_NAME}.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.APP_NAME }}-macOS-Universal-dmg"
          path: dist/${{ env.APP_NAME }}.dmg
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*-macOS-Universal-{dmg,zip}"
          path: artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # The release may already exist if it was created from the GitHub web UI
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifacts to it"
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              artifacts/*.dmg artifacts/*.zip
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              artifacts/*.dmg artifacts/*.zip
          fi
